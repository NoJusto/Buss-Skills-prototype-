let db=JSON.parse(localStorage.getItem('bussV4')||'null')||defaults;let current=null,idx=0;const A=document.getElementById('app');function save(){localStorage.setItem('bussV4',JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nav(x){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===x))}function go(x){nav(x);({home,people,matrix,more}[x]||home)()}function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('')}function latest(n){return db.assessments.find(a=>a.employee===n)}
function home(){let assessed=new Set(db.assessments.map(a=>a.employee)).size;A.innerHTML=`<section class="screen"><div class="hero"><small>TEAM COMPETENCY SYSTEM</small><h1>Know who can do what.</h1><div style="opacity:.85">Assess · Evidence · Develop · Deploy</div></div><div class="grid2"><div class="card stat"><span class="muted">Technicians</span><b>${db.people.length}</b></div><div class="card stat"><span class="muted">Assessed</span><b>${assessed}</b></div><div class="card stat"><span class="muted">Skills</span><b>${db.skills.length}</b></div><div class="card stat"><span class="muted">Evidence</span><b>${db.assessments.reduce((n,a)=>n+Object.values(a.photos||{}).flat().length,0)}</b></div></div><div class="sectionTitle"><h2>Quick actions</h2></div><div class="quick"><button class="btn primary" onclick="newAssessment()"><span>▲</span>New assessment</button><button class="btn ghost" onclick="go('people')"><span>👤</span>Technicians</button><button class="btn ghost" onclick="skillFinder()"><span>🔎</span>Find a skill</button><button class="btn ghost" onclick="teamBuilder()"><span>🧩</span>Build a team</button></div><div class="sectionTitle"><h2>Training needs</h2></div><div class="card"><div class="callout">💡 In the final system, Level 1 assessments can automatically feed a training-needs dashboard.</div>${db.skills.slice(0,4).map((s,i)=>`<div class="listrow"><div><b>${esc(s.name)}</b><small style="display:block;color:var(--muted)">${esc(s.cat)}</small></div><span class="pill">${[3,2,4,1][i]} to develop</span></div>`).join('')}</div></section>`}
function people(){A.innerHTML=`<section class="screen"><div class="sectionTitle"><h2>Technicians</h2><button class="btn primary" onclick="addTechModal()">＋ Add</button></div><input placeholder="Search technician..." oninput="filterPeople(this.value)"><div id="peopleList" class="card" style="margin-top:10px"></div></section>`;filterPeople('')}function filterPeople(q){let ps=db.people.filter(p=>p[0].toLowerCase().includes(q.toLowerCase()));peopleList.innerHTML=ps.map((p)=>`<div class="listrow"><div class="person" onclick="profile('${esc(p[0])}')"><div class="avatar">${initials(p[0])}</div><div><b>${esc(p[0])}</b><small>${esc(p[1])}</small></div></div><button class="btn danger" onclick="removeTech('${esc(p[0])}')">Remove</button></div>`).join('')}
function addTechModal(){modal.innerHTML=`<div class="modalBack"><div class="modal"><h2>Add technician</h2><div class="field"><label>Full name</label><input id="tn"></div><div class="field"><label>Role</label><select id="tr"><option>Third Man</option><option>Second Man</option><option>Blade Technician</option><option>Team Leader</option><option>Supervisor</option></select></div><button class="btn primary full" onclick="addTech()">Add technician</button><button class="btn ghost full" style="margin-top:8px" onclick="closeM()">Cancel</button></div></div>`}function addTech(){if(!tn.value.trim())return;db.people.push([tn.value.trim(),tr.value]);save();closeM();people()}function removeTech(n){if(confirm('Remove '+n+' from active technicians? Historical assessments remain.')){db.people=db.people.filter(p=>p[0]!==n);save();people()}}function closeM(){modal.innerHTML=''}
function newAssessment(){nav('assess');A.innerHTML=`<section class="screen"><div class="sectionTitle"><h2>New assessment</h2></div><div class="card"><div class="field"><label>Technician</label><select id="ae">${db.people.map(p=>`<option>${esc(p[0])}</option>`).join('')}</select></div><div class="field"><label>Project</label><input id="ap" value="MacIntyre Wind Farm"></div><div class="grid2"><div class="field"><label>WTG / Blade</label><input id="ab" placeholder="WTG 104 · Blade B"></div><div class="field"><label>Repair ref.</label><input id="ar" placeholder="MSW / WO"></div></div><div class="field"><label>Assessor</label><input id="aa" value="André Ribeiro"></div><button class="btn primary full" onclick="startA()">Start assessment →</button></div></section>`}function startA(){current={employee:ae.value,project:ap.value,blade:ab.value,repair:ar.value,assessor:aa.value,date:new Date().toISOString().slice(0,10),ratings:{},comments:{},photos:{},training:{}};idx=0;renderSkill()}
function renderSkill(){let s=db.skills[idx],lv=current.ratings[s.name]||0,desc=lv===3?'Advanced · Performs complex work independently and can guide others.':lv===2?'Independent · Performs safely and correctly without routine supervision.':lv===1?'Basic · Can perform the task with guidance or supervision.':'Tap the triangle to select demonstrated capability.';A.innerHTML=`<section class="screen"><div class="progress"><i style="width:${(idx+1)/db.skills.length*100}%"></i></div><div style="display:flex;justify-content:space-between;margin:7px 2px 12px"><span class="pill">${esc(s.cat)}</span><b>${idx+1}/${db.skills.length}</b></div><div class="card triangleWrap"><h2 style="margin:0">${esc(s.name)}</h2><div class="triangle" data-level="${lv}"><div class="seg seg3" onclick="setL(3)">3 · ADVANCED</div><div class="seg seg2" onclick="setL(2)">2 · INDEPENDENT</div><div class="seg seg1" onclick="setL(1)">1 · BASIC</div></div><div class="legend"><span><i style="background:var(--red)"></i>L1</span><span><i style="background:var(--yellow)"></i>L2</span><span><i style="background:var(--green)"></i>L3</span></div><p class="muted">${desc}</p><button class="btn ghost" onclick="setL('NO')">○ Not observed</button></div><div class="card"><div class="sectionTitle" style="margin-top:0"><h2>Evidence</h2><span class="pill">${(current.photos[s.name]||[]).length} photos</span></div><div class="evidenceBtns"><button class="btn ghost" onclick="camera.click()"><span class="bigIcon">📷</span><br>Take photo</button><button class="btn ghost" onclick="gallery.click()"><span class="bigIcon">🖼️</span><br>Choose device</button></div><input id="camera" type="file" accept="image/*" capture="environment" class="hidden" onchange="addPics(this.files)"><input id="gallery" type="file" accept="image/*" multiple class="hidden" onchange="addPics(this.files)"><div class="photos">${(current.photos[s.name]||[]).map(x=>`<img class="photo" src="${x}">`).join('')}</div><div class="field"><label>Assessor comment</label><textarea id="cm">${esc(current.comments[s.name]||'')}</textarea></div>${lv===1?`<div class="field"><label>Development need</label><select id="train"><option>More supervised practice</option><option>Training required</option><option>More project experience</option><option>Quality improvement</option><option>Safety improvement</option></select></div>`:''}</div><div class="grid2"><button class="btn ghost" onclick="prev()">← Back</button><button class="btn primary" onclick="next()">${idx===db.skills.length-1?'Review':'Next →'}</button></div></section>`}
function stash(){let s=db.skills[idx].name,cm=document.getElementById('cm');if(cm)current.comments[s]=cm.value;let t=document.getElementById('train');if(t)current.training[s]=t.value}function setL(l){stash();current.ratings[db.skills[idx].name]=l;renderSkill()}function addPics(files){let k=db.skills[idx].name;current.photos[k]=current.photos[k]||[];[...files].forEach(f=>{let r=new FileReader();r.onload=()=>{current.photos[k].push(r.result);renderSkill()};r.readAsDataURL(f)})}function prev(){stash();if(idx){idx--;renderSkill()}else newAssessment()}function next(){stash();if(idx<db.skills.length-1){idx++;renderSkill()}else review()}
function catStats(a){return db.categories.map(c=>{let names=db.skills.filter(s=>s.cat===c).map(s=>s.name),v=names.map(n=>a.ratings[n]).filter(x=>typeof x==='number');return {c,avg:v.length?v.reduce((x,y)=>x+y,0)/v.length:0,n:v.length,total:names.length}})}function review(){let st=catStats(current);A.innerHTML=`<section class="screen"><div class="hero"><small>ASSESSMENT COMPLETE</small><h1>${esc(current.employee)}</h1><div>${esc(current.project)}</div></div><div class="sectionTitle"><h2>Competency profile</h2></div>${st.map(x=>`<div class="card catCard"><b>${esc(x.c)}</b><div class="scoreline"><span class="score">${x.n?x.avg.toFixed(1):'—'}</span><div class="bar"><i style="width:${x.avg/3*100}%"></i></div></div><small class="muted">${x.n}/${x.total} skills assessed</small></div>`).join('')}<div class="card"><h2>Sign-off</h2><div class="field"><label>Employee acknowledgement</label><select id="ack"><option>Agree</option><option>Acknowledge · Review requested</option></select></div><div class="field"><label>Employee name / signature</label><input id="sig" placeholder="Type name for demo"></div><button class="btn primary full" onclick="submitA()">Submit assessment ✓</button><button class="btn ghost full" style="margin-top:8px" onclick="idx=db.skills.length-1;renderSkill()">Back to skills</button></div></section>`}function submitA(){current.ack=ack.value;current.signature=sig.value;db.assessments.unshift(current);save();let n=current.employee;current=null;profile(n)}
function profile(n){nav('people');let p=db.people.find(x=>x[0]===n)||[n,'Technician'],a=latest(n)||{ratings:{}};let st=catStats(a);A.innerHTML=`<section class="screen"><div class="hero"><div class="person"><div class="avatar" style="background:#fff;color:#0a5fae">${initials(n)}</div><div><h1 style="font-size:22px">${esc(n)}</h1><div>${esc(p[1])}</div></div></div></div><button class="btn primary full" onclick="newAssessmentFor('${esc(n)}')">▲ New assessment</button><div class="sectionTitle"><h2>Competency profile</h2></div>${st.map(x=>`<div class="card catCard" onclick="categoryDetail('${esc(n)}','${esc(x.c)}')"><div class="categoryHead"><b>${esc(x.c)}</b><span>›</span></div><div class="scoreline"><span class="score">${x.n?x.avg.toFixed(1):'—'}</span><div class="bar"><i style="width:${x.avg/3*100}%"></i></div></div></div>`).join('')}<div class="card"><b>Assessment history</b><div class="muted" style="margin-top:5px">${db.assessments.filter(x=>x.employee===n).length} assessments stored locally</div></div></section>`}function newAssessmentFor(n){newAssessment();ae.value=n}function categoryDetail(n,c){let a=latest(n)||{ratings:{}};A.innerHTML=`<section class="screen"><button class="btn ghost" onclick="profile('${esc(n)}')">← Profile</button><div class="sectionTitle"><h2>${esc(c)}</h2></div><div class="card">${db.skills.filter(s=>s.cat===c).map(s=>{let l=a.ratings[s.name];return `<div class="skillrow"><div><b>${esc(s.name)}</b><small style="display:block;color:var(--muted)">${typeof l==='number'?'Level '+l:l==='NO'?'Not observed':'Not assessed'}</small></div><div class="miniTri ${typeof l==='number'?'l'+l:'no'}">${l||'—'}</div></div>`}).join('')}</div></section>`}
function matrix(){A.innerHTML=`<section class="screen"><div class="sectionTitle"><h2>Skills explorer</h2><button class="btn ghost" onclick="skillFinder()">🔎 Filter</button></div><div class="callout">Mobile view ranks technicians by selected skill instead of forcing a wide spreadsheet matrix.</div>${db.categories.map(c=>`<div class="card"><div class="categoryHead"><b>${esc(c)}</b><span class="pill">${db.skills.filter(s=>s.cat===c).length}</span></div>${db.skills.filter(s=>s.cat===c).map(s=>`<div class="listrow" onclick="rankSkill('${esc(s.name)}')"><span>${esc(s.name)}</span><span>›</span></div>`).join('')}</div>`).join('')}</section>`}function rankSkill(s){let rows=db.people.map(p=>({p,l:(latest(p[0])||{ratings:{}}).ratings[s]})).sort((a,b)=>(b.l||0)-(a.l||0));A.innerHTML=`<section class="screen"><button class="btn ghost" onclick="matrix()">← Skills</button><div class="sectionTitle"><h2>${esc(s)}</h2></div><div class="card">${rows.map((x,i)=>`<div class="listrow"><div class="rank"><div class="rankNum">${i+1}</div><div><b>${esc(x.p[0])}</b><small style="display:block;color:var(--muted)">${esc(x.p[1])}</small></div></div><div class="miniTri ${typeof x.l==='number'?'l'+x.l:'no'}">${x.l||'—'}</div></div>`).join('')}</div></section>`}function skillFinder(){matrix()}
function teamBuilder(){A.innerHTML=`<section class="screen"><button class="btn ghost" onclick="home()">← Home</button><div class="sectionTitle"><h2>Build a team</h2></div><div class="hero"><h1>Find qualified people</h1><div>Prototype management tool</div></div><div class="card"><div class="field"><label>Required skill</label><select id="bs">${db.skills.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Minimum level</label><select id="bl"><option value="2">Level 2 · Independent</option><option value="3">Level 3 · Advanced</option></select></div><button class="btn primary full" onclick="findTeam()">Find technicians</button></div><div id="teamResults"></div></section>`}function findTeam(){let s=bs.value,l=+bl.value,r=db.people.filter(p=>((latest(p[0])||{ratings:{}}).ratings[s]||0)>=l);teamResults.innerHTML=`<div class="sectionTitle"><h2>Qualified (${r.length})</h2></div><div class="card">${r.length?r.map(p=>`<div class="listrow"><div class="person"><div class="avatar">${initials(p[0])}</div><b>${esc(p[0])}</b></div><span class="pill">Level ${(latest(p[0]).ratings[s])}</span></div>`).join(''):'<div class="empty">No matching technicians in demo data.</div>'}</div>`}
function more(){A.innerHTML=`<section class="screen"><div class="sectionTitle"><h2>Manage prototype</h2></div><div class="card"><button class="btn ghost full" onclick="manageSkills()">⚙️ Skills & categories</button><button class="btn ghost full" style="margin-top:8px" onclick="addTechModal()">👤 Add technician</button><button class="btn ghost full" style="margin-top:8px" onclick="teamBuilder()">🧩 Build a team</button></div><div class="callout">All demo data stays only in this browser using local storage. No BUSS systems are connected.</div></section>`}function manageSkills(){A.innerHTML=`<section class="screen"><button class="btn ghost" onclick="more()">← More</button><div class="sectionTitle"><h2>Skills & categories</h2><button class="btn primary" onclick="addSkillModal()">＋ Skill</button></div>${db.categories.map(c=>`<div class="card"><div class="categoryHead"><b>${esc(c)}</b><button class="btn danger" onclick="removeCat('${esc(c)}')">Remove</button></div>${db.skills.filter(s=>s.cat===c).map(s=>`<div class="listrow"><span>${esc(s.name)}</span><button class="btn danger" onclick="removeSkill('${esc(s.name)}')">×</button></div>`).join('')}</div>`).join('')}<button class="btn ghost full" onclick="addCatModal()">＋ Add category</button></section>`}function addSkillModal(){modal.innerHTML=`<div class="modalBack"><div class="modal"><h2>Add skill / task</h2><div class="field"><label>Category</label><select id="sc">${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Skill name</label><input id="sn"></div><button class="btn primary full" onclick="addSkill()">Add skill</button><button class="btn ghost full" style="margin-top:8px" onclick="closeM()">Cancel</button></div></div>`}function addSkill(){if(!sn.value.trim())return;db.skills.push({name:sn.value.trim(),cat:sc.value});save();closeM();manageSkills()}function removeSkill(n){if(confirm('Remove '+n+' from future assessments?')){db.skills=db.skills.filter(s=>s.name!==n);save();manageSkills()}}function addCatModal(){modal.innerHTML=`<div class="modalBack"><div class="modal"><h2>Add category</h2><div class="field"><label>Category name</label><input id="cn"></div><button class="btn primary full" onclick="addCat()">Add category</button><button class="btn ghost full" style="margin-top:8px" onclick="closeM()">Cancel</button></div></div>`}function addCat(){if(cn.value.trim()&&!db.categories.includes(cn.value.trim()))db.categories.push(cn.value.trim());save();closeM();manageSkills()}function removeCat(c){if(db.skills.some(s=>s.cat===c))return alert('Remove the skills in this category first.');db.categories=db.categories.filter(x=>x!==c);save();manageSkills()}
save();go('home');
</script></body></html>
